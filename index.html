<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F2F2">
<title>Parabolic Hunter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
:root {
--bg: #F3F2F2; --card: #FFFFFF; --ink: #201E1D; --muted: #6B6663; --faint: #9B9591;
--line: #E4E1DF; --red: #EC3013; --red-tint: #FDEBE7; --green: #157F3D;
--green-tint: #EAF4EC; --blue: #1D4ED8; --blue-tint: #EBF0FB; --amber: #B45309;
--amber-tint: #FBF3E4; --band: #F5F3F2; --track: #E4E1DF;
--paper: #F7F3EC; --paper-k: #8A4B23; --paper-ink: #26211B;
}
[data-theme="dark"] {
--bg: #14120F; --card: #1E1B18; --ink: #F3F1EF; --muted: #A8A29D; --faint: #6E6963;
--line: #322E2A; --red: #FF4D2E; --red-tint: #3A1B14; --green: #4CC38A;
--green-tint: #15291D; --blue: #6C9BFF; --blue-tint: #172032; --amber: #F5A623;
--amber-tint: #322710; --band: #262220; --track: #3A3530;
--paper: #262220; --paper-k: #F5A623; --paper-ink: #F3F1EF;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
background: var(--bg); color: var(--ink); min-height: 100vh;
font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.up { text-transform: uppercase; letter-spacing: .8px; }
header { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 2px solid var(--ink); }
.status {
display: flex; justify-content: space-between; align-items: center;
padding: 10px 16px 0; font-size: 11px; font-weight: 800; color: var(--muted);
}
.status .live { color: var(--green); }
.status .closed { color: var(--muted); }
.themebtn { background: none; border: 1px solid var(--line); border-radius: 6px;
font-size: 12px; padding: 3px 8px; color: var(--muted); }
.hrow { display: flex; align-items: center; justify-content: space-between; padding: 2px 16px 8px; }
h1 { font-size: 26px; font-weight: 900; letter-spacing: -.5px; }
h1 em { font-style: normal; color: var(--red); }
.sync { font-size: 11px; font-weight: 700; color: var(--muted); display: flex;
align-items: center; gap: 6px; cursor: pointer; }
.dot { width: 8px; height: 8px; background: var(--green); }
.dot.err { background: var(--red); }
.dot.pulse { animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.tabs { display: flex; border-top: 1px solid var(--line); }
.tab {
flex: 1; background: var(--band); border: 0; border-right: 1px solid var(--line);
font: inherit; font-size: 11.5px; font-weight: 800; padding: 14px 4px; min-height: 44px; color: var(--muted);
text-transform: uppercase; letter-spacing: .5px; position: relative;
}
.tab:last-child { border-right: 0; }
.tab b { color: var(--red); margin-left: 4px; }
.tab.on { background: var(--card); color: var(--ink); }
.tab.on::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--red); }
.ribbon {
display: flex; align-items: center; justify-content: space-between; gap: 10px;
background: var(--red); color: #fff; padding: 11px 16px; font-size: 13px; font-weight: 800;
}
.ribbon span { text-transform: uppercase; letter-spacing: .5px; white-space: nowrap;
overflow: hidden; text-overflow: ellipsis; }
main { max-width: 560px; margin: 0 auto; padding: 12px 12px 40px; }
.banner {
background: var(--amber-tint); color: var(--amber); border: 1px solid var(--amber);
font-size: 12px; font-weight: 700; padding: 8px 12px; margin-bottom: 10px;
}
.card { background: var(--card); border: 1px solid var(--line); margin-bottom: 12px;
box-shadow: 0 1px 0 var(--line); }
.pad { padding: 13px 14px; }
.top { display: flex; align-items: baseline; gap: 8px; }
.sym { font-size: 21px; font-weight: 900; letter-spacing: -.3px; }
.chipst {
font-size: 10px; font-weight: 800; padding: 3px 7px; text-transform: uppercase;
letter-spacing: .6px; align-self: center;
}
.st-star { background: var(--red-tint); color: var(--red); }
.st-ref { background: var(--band); color: var(--muted); }
.st-held { background: var(--green-tint); color: var(--green); }
.st-fail { background: var(--red-tint); color: var(--red); }
.st-warn { background: var(--amber-tint); color: var(--amber); }
.px { margin-left: auto; text-align: right; }
.px .v { font-size: 19px; font-weight: 900; font-variant-numeric: tabular-nums; }
.px .a { font-size: 11px; color: var(--faint); font-weight: 700; }
.cond { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase;
letter-spacing: .5px; margin-top: 3px; }
.agoline { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.agoline .t { font-size: 11px; font-weight: 700; color: var(--faint); flex: 0 0 auto; }
.bar { flex: 1; height: 4px; background: var(--track); position: relative; }
.bar i { position: absolute; inset: 0; right: 30%; background: var(--red); }
.meter { margin-top: 12px; }
.meter .trk { position: relative; height: 4px; background: var(--track); margin: 14px 6px 4px; }
.mk { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px;
border-radius: 50%; border: 2px solid var(--card); }
.mk.stop { background: var(--red); } .mk.entry { background: var(--ink); }
.mk.now { background: var(--blue); width: 14px; height: 14px; z-index: 2; }
.mk.tgt { background: var(--green); }
.mlbl { display: flex; justify-content: space-between; font-size: 10px; font-weight: 800;
color: var(--faint); text-transform: uppercase; letter-spacing: .4px; padding: 0 2px; }
.tri { display: flex; margin-top: 12px; border: 1px solid var(--line); }
.tri > div { flex: 1; padding: 9px 8px; }
.tri > div + div { border-left: 1px solid var(--line); }
.tri .k { font-size: 10px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; }
.tri .v { font-size: 17px; font-weight: 900; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tri .p { font-size: 11px; font-weight: 700; margin-top: 1px; }
.t-entry { background: var(--blue-tint); } .t-entry .k, .t-entry .p { color: var(--blue); }
.t-stop { background: var(--red-tint); } .t-stop .k, .t-stop .p { color: var(--red); }
.t-tgt { background: var(--green-tint); } .t-tgt .k, .t-tgt .p { color: var(--green); }
.band { display: flex; gap: 12px; margin-top: 12px; padding: 10px 12px;
border-left: 4px solid var(--green); background: var(--green-tint); }
.band .big { font-size: 16px; font-weight: 900; align-self: center; color: var(--green);
font-variant-numeric: tabular-nums; white-space: nowrap; }
.band .k { font-size: 9.5px; font-weight: 800; letter-spacing: .6px;
text-transform: uppercase; color: var(--muted); }
.band .t { font-size: 12px; font-weight: 700; margin-top: 2px; }
.band.b { border-left-color: var(--blue); background: var(--blue-tint); }
.band.b .big { color: var(--blue); }
.band.r { border-left-color: var(--red); background: var(--red-tint); }
.band.r .big { color: var(--red); }
.chain { margin-top: 12px; border: 1px solid var(--line); }
.crow { display: flex; align-items: center; gap: 8px; padding: 7px 10px; font-size: 12.5px;
font-weight: 600; border-bottom: 1px solid var(--line); }
.crow:last-child { border-bottom: 0; }
.crow.g { background: var(--green-tint); } .crow.r { background: var(--red-tint); }
.crow.w { background: var(--amber-tint); }
.crow .ic { flex: 0 0 18px; text-align: center; }
.btns { display: flex; gap: 8px; margin-top: 12px; }
.bigbtn {
flex: 1; border: 2px solid var(--red); background: var(--red);
color: #fff; font: inherit; font-size: 13px; font-weight: 900; padding: 13px 8px;
text-transform: uppercase; letter-spacing: .8px;
}
.bigbtn.ghost { background: var(--card); color: var(--ink); border-color: var(--ink); flex: 0 0 32%; }
.bigbtn.armed { background: var(--ink); border-color: var(--ink); }
a.bigbtn { display: block; text-align: center; text-decoration: none; margin-top: 12px;
background: var(--blue); border-color: var(--blue); }
.attnote { margin-top: 10px; font-size: 12px; font-weight: 700; color: var(--faint); }
.refuse {
margin-top: 12px; background: var(--ink); color: var(--card); font-size: 12px;
font-weight: 800; padding: 10px 12px; text-transform: uppercase; letter-spacing: .6px;
}
.pending { margin-top: 9px; font-size: 12px; font-weight: 700; color: var(--amber); }
.verdbig { font-size: 24px; font-weight: 900; letter-spacing: -.3px; margin-top: 8px; }
.verdbig.g { color: var(--green); } .verdbig.r { color: var(--red); }
.verdbig.w { color: var(--amber); }
.body { margin-top: 8px; font-size: 13px; line-height: 1.6; white-space: pre-wrap;
word-break: break-word; color: var(--ink); }
.rows { margin-top: 10px; }
.rows .rw { display: flex; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line);
font-size: 13px; font-weight: 600; }
.rows .rw:last-child { border-bottom: 0; }
pre.tbl { margin-top: 10px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
font-size: 11px; line-height: 1.7; overflow-x: auto; padding: 10px;
background: var(--band); border: 1px solid var(--line); -webkit-overflow-scrolling: touch; }
.band.w { border-left-color: var(--amber); background: var(--amber-tint); }
.band.w .big { color: var(--amber); }
.dprow { display: flex; align-items: center; gap: 7px; padding: 8px 0;
border-bottom: 1px solid var(--line); font-size: 12.5px; font-weight: 700;
font-variant-numeric: tabular-nums; }
.dprow:last-child { border-bottom: 0; }
.dprow .ic { flex: 0 0 20px; text-align: center; }
.dprow .nm { font-weight: 900; flex: 0 0 44px; }
.dprow .dv { flex: 0 0 46px; }
.dprow .dv.g { color: var(--green); } .dprow .dv.r { color: var(--red); }
.dprow .bk { font-size: 9.5px; font-weight: 800; padding: 2px 5px; letter-spacing: .4px; }
.dprow .bk.big { background: var(--blue-tint); color: var(--blue); }
.dprow .bk.small { background: var(--band); color: var(--muted); }
.dprow .dt { font-size: 10.5px; color: var(--faint); flex: 0 0 38px; }
.dprow .ocs { margin-left: auto; display: flex; gap: 8px; }
.oc { font-size: 12px; font-weight: 800; }
.oc.hit { color: var(--green); } .oc.miss { color: var(--red); }
.oc.pend { color: var(--faint); font-weight: 700; }
.dprow.back { opacity: .75; }
.dprow.back .nm::after { content: "backfilled"; font-size: 8.5px; font-weight: 800;
color: var(--amber); background: var(--amber-tint); padding: 1px 4px; margin-left: 5px;
text-transform: uppercase; letter-spacing: .4px; vertical-align: middle; }
.empty { text-align: center; color: var(--faint); padding: 70px 20px; font-size: 13px;
font-weight: 700; text-transform: uppercase; letter-spacing: .5px; line-height: 2; }
.foot { text-align: center; font-size: 10.5px; font-weight: 700; color: var(--faint);
padding: 18px 0 8px; text-transform: uppercase; letter-spacing: .5px; }
.foot .lnk { text-decoration: underline; cursor: pointer; }
.toast {
position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
transform: translateX(-50%); background: var(--ink); color: var(--card); font-size: 12px;
font-weight: 800; padding: 10px 18px; z-index: 50; opacity: 0; transition: opacity .2s;
text-transform: uppercase; letter-spacing: .6px; white-space: nowrap;
}
.toast.show { opacity: 1; }
input.setup {
width: 100%; padding: 12px; border: 2px solid var(--ink); background: var(--card);
color: var(--ink); font: inherit; font-size: 15px; margin: 10px 0;
}
.why { margin-top: 12px; padding: 12px 14px; background: var(--paper); border: 1px solid var(--line); }
.why .k { font-size: 10px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--paper-k); }
.prose { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-size: 14.5px;
line-height: 1.65; color: var(--paper-ink); margin-top: 6px; white-space: pre-wrap; word-break: break-word; }
.prose.story { margin-top: 10px; color: var(--ink); }
.st-story { background: var(--blue-tint); color: var(--blue); }
.agenote { margin-top: 10px; font-size: 11.5px; font-weight: 800; color: var(--amber);
background: var(--amber-tint); padding: 8px 10px; text-transform: uppercase;
letter-spacing: .5px; }
.dbgbar { display: flex; gap: 8px; margin: 18px 0 0; }
input.dbg { flex: 1; min-width: 0; padding: 11px 12px; border: 2px solid var(--line);
background: var(--card); color: var(--ink); font: inherit; font-size: 14px;
font-weight: 800; text-transform: uppercase; letter-spacing: .5px; }
input.dbg:focus { border-color: var(--ink); outline: none; }
.bigbtn.dbg { flex: 0 0 26%; background: var(--ink); border-color: var(--ink); }
.bigbtn.dbg.alt { background: var(--blue); border-color: var(--blue); flex: 0 0 24%; }

/* ─── STATES tab (added 2026-10-04) ───────────────────────────────────────
   Read-only. Renders monitor/states.json, which rides the feed topic as its
   own message titled "states.json". Nothing here writes, logs or buttons.

   The state and MA colours are declared as their own tokens rather than
   reusing --red/--green/--blue, because the state palette is fixed by the
   desk (good #157F3D, warning #B45309, bad #D22B12, info #1D4ED8, muted
   #6B6560) and the page's own accent values differ slightly. Dark mode
   REDEFINES them below -- nothing is inverted.                            */
:root {
--s-good: #157F3D; --s-warn: #B45309; --s-bad: #D22B12; --s-info: #1D4ED8;
--s-muted: #6B6560;
--ma20: #7A7268; --ma50: #1F6FEB; --ma200: #C9930A;
}
/* Dark: lightened to the same degree the page lightens its own accents.
   Measured against the dark card (#1E1B18): MA50 #6C9BFF = 6.3:1 and
   MA200 #E0A82E = 8.0:1, both well clear of 3:1. The light values would
   have been 3.7:1 (MA50) and 6.3:1 (MA200) -- MA50 only just passing,
   which is why it is lifted here rather than left alone.                  */
[data-theme="dark"] {
--s-good: #4CC38A; --s-warn: #F5A623; --s-bad: #FF6A4D; --s-info: #6C9BFF;
--s-muted: #A8A29D;
--ma20: #9A9289; --ma50: #6C9BFF; --ma200: #E0A82E;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip {
display: flex; align-items: center; gap: 5px; border: 1px solid var(--line);
background: var(--card); padding: 6px 9px; font-size: 11px; font-weight: 800;
text-transform: uppercase; letter-spacing: .4px;
}
.chip .g { font-size: 13px; line-height: 1; }
.chip .n { font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 900; }
.chip.zero { opacity: .42; }
.chip.s-BROKEN { color: var(--s-bad); border-color: var(--s-bad); }
.chip.s-STRESSED { color: var(--s-warn); border-color: var(--s-warn); }
.chip.s-EARLY { color: var(--s-info); border-color: var(--s-info); }
.chip.s-HEALTHY { color: var(--s-good); border-color: var(--s-good); }
.chip.s-NONE, .chip.s-NOBARS { color: var(--s-muted); }
.alerts { border: 1px solid var(--line); margin-bottom: 12px; background: var(--card); }
.alerts .hd {
font-size: 10px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase;
color: var(--muted); padding: 8px 12px 6px; border-bottom: 1px solid var(--line);
}
.arow {
display: flex; align-items: center; gap: 8px; padding: 9px 12px;
border-bottom: 1px solid var(--line); font-size: 12.5px; font-weight: 700;
text-decoration: none; color: var(--ink);
}
.aitem { border-bottom: 1px solid var(--line); }
.aitem:last-child { border-bottom: 0; }
.arow { border-bottom: 0; }
.arow .g { flex: 0 0 16px; text-align: center; font-size: 14px; }
.arow .nm { font-weight: 900; flex: 0 0 52px; }
.arow .mv { color: var(--muted); }
.arow .tm { margin-left: auto; font-size: 11px; color: var(--faint);
font-variant-numeric: tabular-nums; }
.arow .pin { font-size: 10px; font-weight: 800; color: var(--s-info); margin-left: 6px; }
/* The three-line fallback is a SIBLING of its row inside .aitem, not a
   child of it: the row is an <a> when a card image exists, and nesting a
   paragraph inside that link would make the whole thing a tap target. */
.three { font-size: 11px; color: var(--faint); font-weight: 600;
white-space: pre-wrap; padding: 0 12px 9px; margin-top: -4px; }
.cohhd {
display: flex; align-items: center; gap: 10px; background: var(--band);
border: 1px solid var(--line); border-bottom: 0; padding: 9px 12px;
}
.cohhd .lb { font-size: 12.5px; font-weight: 900; text-transform: uppercase;
letter-spacing: .5px; }
.cohhd .live { font-size: 10.5px; font-weight: 700; color: var(--faint);
font-variant-numeric: tabular-nums; }
.cohhd .rs { margin-left: auto; font-size: 14px; font-weight: 900;
font-variant-numeric: tabular-nums; }
.cohhd .rs.g { color: var(--s-good); } .cohhd .rs.r { color: var(--s-bad); }
.bbar { flex: 0 0 86px; height: 6px; background: var(--track); position: relative; }
.bbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--s-good); }
.bbar i.lo { background: var(--s-warn); }
.cohnote { font-size: 10.5px; font-weight: 800; color: var(--s-warn);
background: var(--amber-tint); padding: 4px 12px; border: 1px solid var(--line);
border-top: 0; border-bottom: 0; text-transform: uppercase; letter-spacing: .4px; }
.mcard { border: 1px solid var(--line); border-bottom: 0; background: var(--card);
padding: 11px 12px; }
.coh .mcard:last-child { border-bottom: 1px solid var(--line); }
.mtop { display: flex; align-items: baseline; gap: 7px; }
.mtop .sy { font-size: 17px; font-weight: 900; letter-spacing: -.2px; }
.mtop .ro { font-size: 10px; font-weight: 800; color: var(--faint);
text-transform: uppercase; letter-spacing: .5px; }
.pill {
margin-left: auto; font-size: 10px; font-weight: 800; padding: 3px 7px;
text-transform: uppercase; letter-spacing: .5px; white-space: nowrap;
border: 1px solid currentColor;
}
.pill.s-BROKEN { color: var(--s-bad); background: var(--red-tint); }
.pill.s-STRESSED { color: var(--s-warn); background: var(--amber-tint); }
.pill.s-EARLY { color: var(--s-info); background: var(--blue-tint); }
.pill.s-HEALTHY { color: var(--s-good); background: var(--green-tint); }
.pill.s-NONE, .pill.s-NOBARS { color: var(--s-muted); background: var(--band); }
.quad { display: flex; margin-top: 10px; border: 1px solid var(--line); }
.quad > div { flex: 1; padding: 7px 6px; }
.quad > div + div { border-left: 1px solid var(--line); }
.quad .k { font-size: 8.5px; font-weight: 800; letter-spacing: .5px;
text-transform: uppercase; color: var(--muted); }
.quad .v { font-size: 14px; font-weight: 900; margin-top: 2px;
font-variant-numeric: tabular-nums; }
/* The tile that DEFINES the state is tinted in that state's own colour, so
   the number doing the work is the one the eye lands on. A plain grey wash
   was invisible against the white card. */
.quad > div.def { background: var(--band); }
.quad > div.def .k { color: inherit; }
.quad > div.def.s-BROKEN { background: var(--red-tint); }
.quad > div.def.s-BROKEN .k, .quad > div.def.s-BROKEN .v { color: var(--s-bad); }
.quad > div.def.s-STRESSED { background: var(--amber-tint); }
.quad > div.def.s-STRESSED .k, .quad > div.def.s-STRESSED .v { color: var(--s-warn); }
.quad > div.def.s-EARLY { background: var(--blue-tint); }
.quad > div.def.s-EARLY .k, .quad > div.def.s-EARLY .v { color: var(--s-info); }
.quad > div.def.s-NONE .k, .quad > div.def.s-NONE .v { color: var(--s-muted); }
/* The tag sits ABOVE the panel, not on it: at the top-right of the plot it
   collided with the 10-session-high dotted line on every name whose high was
   near the top of the range, which was most of them. */
.spark { margin-top: 10px; position: relative; padding-top: 13px; }
.spark svg { display: block; width: 100%; height: 72px; }
.spark .tag { position: absolute; right: 2px; top: 0; font-size: 9px;
font-weight: 800; color: var(--ma200); letter-spacing: .3px; }
/* Top-left, beside the MA200 tag. Below the panel it sat on top of the
   legend row, which is a sibling and not part of this box. */
.spark .n40 { position: absolute; left: 2px; top: 0; font-size: 9px;
font-weight: 700; color: var(--faint); }
.leg { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 4px; }
.leg span { font-size: 9px; font-weight: 800; color: var(--muted);
display: flex; align-items: center; gap: 3px; text-transform: uppercase;
letter-spacing: .3px; }
.leg i { width: 13px; height: 2px; display: inline-block; }
.mline { margin-top: 7px; font-size: 11.5px; font-weight: 700; color: var(--muted);
font-variant-numeric: tabular-nums; }
.mline.str { color: var(--s-good); }

if (Number.isFinite(v) && v > 0) localStorage.setItem(ACCT_KEY, String(v));
else localStorage.removeItem(ACCT_KEY);
} catch (err) {}
render();
};
inp.addEventListener("keydown", (ev) => {
if (ev.key === "Enter") commit();
if (ev.key === "Escape") render();
});
inp.addEventListener("blur", commit);
ab.replaceWith(inp);
inp.focus(); inp.select();
return;
}
const t = e.target.closest(".tab");
if (t) { tab = t.dataset.tab; syncIndicator(); renderTabs(); render(); return; }
const c = e.target.closest("[data-copy]");
if (c) { navigator.clipboard?.writeText(c.dataset.copy).then(() => toast("Log command copied")); return; }
const g = e.target.closest("[data-logcmd]");
if (g) {
let ct = "";
try { ct = localStorage.getItem("walls_cmd") || ""; } catch {}
if (!ct) {
ct = (prompt("Command topic (from cmd_listener on the VM):") || "").trim();
if (!ct) return;
try { localStorage.setItem("walls_cmd", ct); } catch {}
}
if (g.dataset.armed !== "1") {
g.dataset.armed = "1"; g.classList.add("armed");
const orig = g.textContent; g.textContent = "Tap again to log";
setTimeout(() => { g.dataset.armed = "0"; g.classList.remove("armed");
g.textContent = orig; }, 3500);
return;
}
g.dataset.armed = "0"; g.classList.remove("armed"); g.textContent = "Sent";
fetch("https://ntfy.sh/" + encodeURIComponent(ct),
{ method: "POST", body: g.dataset.logcmd, headers: { "Title": "cmd" } })
.then(() => toast("Sent to desk — watch for receipt"))
.catch(() => { g.textContent = "Log trade"; toast("Send failed"); });
}
});
// ─── the sparkline crosshair ────────────────────────────────────────────────
// Pointer events, so one handler covers mouse and touch. The series travel on
// the element itself (data-spark), so dragging needs no lookup back into the
// document and a re-render cannot leave the handler pointing at stale data.
//
// The readout gives the close, the three averages and the pull AT THAT POINT.
// The pull is recomputed from the close series by the desk's own definition
// (close over the highest of the previous 10 closes), so it is the same
// quantity the card's tile shows, not an approximation of it.
//
// It cannot give a DATE: states.json's spark carries four arrays of numbers
// and no session dates, so the readout says how far back the point is
// instead. Adding a dates array to the spark block in monitor_json.py would
// fix it; that is a VM change and this pass does not touch the VM.
function xhMove(sp, clientX) {
let d;
try { d = JSON.parse(sp.dataset.spark || "{}"); } catch { return; }
if (!d.c || !d.c.length) return;
const svg = sp.querySelector("svg");
const box = svg.getBoundingClientRect();
if (!box.width) return;
const f = Math.min(1, Math.max(0, (clientX - box.left) / box.width));
const i = Math.round(f * (d.n - 1));
const W = 320, H = 72;
const x = (d.n < 2) ? 0 : (i * W / (d.n - 1));
const g = svg.querySelector(".xh");
const vb = svg.viewBox.baseVal;
// the dot rides the close line: map the value back through the same scale
const all = [];
[d.c, d.a, d.b, d.d].forEach((arr) => {
if (Array.isArray(arr)) arr.forEach((v) => { if (Number.isFinite(v)) all.push(v); });
});
let lo = Math.min(...all), hi = Math.max(...all);
if (!(hi > lo)) hi = lo + 1;
const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
const Y = (v) => (H - (v - lo) / (hi - lo) * H);
g.style.display = "";
g.querySelector(".xhl").setAttribute("x1", x);
g.querySelector(".xhl").setAttribute("x2", x);
const dot = g.querySelector(".xhd");
dot.setAttribute("cx", x);
dot.setAttribute("cy", Number.isFinite(d.c[i]) ? Y(d.c[i]) : H);
const back = (d.n - 1) - i;
const bits = [back === 0 ? "latest" : back + " back",
Number.isFinite(d.c[i]) ? d.c[i].toFixed(2) : "—",
"20d " + fp1(Number.isFinite(d.a[i]) && d.c[i] ? d.c[i] / d.a[i] - 1 : null),
"50d " + fp1(Number.isFinite(d.b[i]) && d.c[i] ? d.c[i] / d.b[i] - 1 : null)];
if (d.d && Number.isFinite(d.d[i]) && d.c[i]) bits.push("200d " + fp1(d.c[i] / d.d[i] - 1));
bits.push("pull " + fp1(d.p ? d.p[i] : null));
sp.querySelector(".xhread").textContent = bits.join(" · ");
}
function xhEnd(sp) {
const g = sp.querySelector(".xh");
if (g) g.style.display = "none";
const r = sp.querySelector(".xhread");
if (r) r.textContent = "";
}
document.addEventListener("pointerdown", (e) => {
const sp = e.target.closest && e.target.closest(".spark");
if (!sp || !sp.dataset.spark) return;
sp.setPointerCapture && sp.setPointerCapture(e.pointerId);
sp.dataset.dragging = "1";
xhMove(sp, e.clientX);
});
document.addEventListener("pointermove", (e) => {
const sp = e.target.closest && e.target.closest(".spark");
if (!sp || sp.dataset.dragging !== "1") return;
e.preventDefault();
xhMove(sp, e.clientX);
}, { passive: false });
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) {
document.addEventListener(ev, (e) => {
const sp = e.target.closest && e.target.closest(".spark");
if (!sp) return;
sp.dataset.dragging = "0";
xhEnd(sp);
});
}
document.getElementById("syncbtn").addEventListener("click", refresh);
function toast(txt) {
const el = document.getElementById("toast");
el.textContent = txt; el.classList.add("show");
setTimeout(() => el.classList.remove("show"), 1600);
}
renderTabs();
refresh();
setInterval(refresh, REFRESH_MS);
if (deskInstalled) toast("Desk topic installed ✓");
</script>
</body>
