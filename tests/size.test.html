<!doctype html><meta charset="utf-8"><title>SIZE line, ladder C</title>
<style>body{font:13px ui-monospace,monospace;padding:16px;background:#111;color:#ddd}
.ok::before{content:"ok   ";color:#5c5}.bad::before{content:"FAIL ";color:#f55}.bad{color:#f88}
iframe{width:400px;height:300px;opacity:.01;position:fixed;bottom:0;right:0}</style>
<h1 style="font-size:15px">SIZE line, ladder C multiplier</h1><div id="sum">running…</div><div id="out"></div>
<script>
// Runs on the frozen states_live.json (as_of 2026-10-09 17:02). That file has
// no EARLY row, so each state is set on a copy of a frozen row: the renderer
// is what is under test, not the roster's mix on that date.
let P=0,F=0;const FAILED=[];const out=document.getElementById("out");
function check(l,c){c?P++:(F++,FAILED.push(l));out.insertAdjacentHTML("beforeend",`<div class="${c?"ok":"bad"}">${l}</div>`);}
function done(){document.getElementById("sum").textContent=`${P} passed, ${F} failed`;
 if(FAILED.length)document.getElementById("sum").insertAdjacentHTML("afterend",
  "<div class='bad'>"+FAILED.map(x=>"<div>FAILED  "+x+"</div>").join("")+"</div>");}
fetch("states_live.json").then(r=>r.json()).then(doc=>{
 const f=document.createElement("iframe");f.src="../index.html";document.body.appendChild(f);
 f.onload=()=>{const w=f.contentWindow;
  try{w.localStorage.removeItem("walls_account");}catch(e){}
  const host=document.createElement("div");host.style.cssText="position:fixed;left:-9999px;width:460px";
  document.body.appendChild(host);
  const copy=(o)=>JSON.parse(JSON.stringify(o));
  const line=(r)=>{host.innerHTML=w.memberCard(r,null,false);
    const e=host.querySelector(".sizeline");return e?e.textContent.replace(/\s+/g," "):"";};
  const rows=doc.names;
  const base=(r)=>Math.floor(r.size.account*r.size.risk_pct/r.size.stop_dollars);
  const nvda=rows.find(r=>r.name==="NVDA");
  check("the frozen document is the close basis",doc.basis==="close");
  check("NVDA computes to 11 sh on the frozen row",base(nvda)===11);

  // all five states, on one row, exact text
  for(const [st,lab,want] of [["HEALTHY","1.00",11],["EARLY","0.50",5],
      ["STRESSED","0.25",2],["NONE","0.25",2],["BROKEN","0",0]]){
    const r=copy(nvda);r.state=st;const t=line(r);
    const s=`at 1.5% risk: 11 sh × ${lab} (${st}) = ${want} sh`;
    check(st+": "+s,t.includes(s));
    check(st+": the notional follows the sized shares",
      t.includes("("+w.money(want*r.close)+")"));
  }
  check("one constant holds the five multipliers",
    w.eval("JSON.stringify(LADDER_C)")===JSON.stringify({HEALTHY:1,EARLY:.5,STRESSED:.25,NONE:.25,BROKEN:0}));

  // the rounding
  const shaped=(sh,st)=>{const r=copy(nvda);r.state=st;
    r.size.stop_dollars=r.size.account*r.size.risk_pct/sh;return r;};
  for(const [sh,st,want] of [[9,"STRESSED",2],[3,"STRESSED",0],[3,"EARLY",1],
      [1,"EARLY",0],[7,"NONE",1],[8,"STRESSED",2],[4,"EARLY",2]]){
    check(`${sh} sh ${st} rounds down to ${want}`,line(shaped(sh,st)).includes(`= ${want} sh`));
  }
  check("the example line reads as specified",
    line(shaped(9,"STRESSED")).includes("at 1.5% risk: 9 sh × 0.25 (STRESSED) = 2 sh"));

  // every frozen row
  let n=0;
  const lad=w.eval("LADDER_C");
  for(const r of rows){if(line(r).includes(`(${r.state}) = ${Math.floor(base(r)*lad[r.state])} sh`))n++;}
  check(`every frozen row renders its state and shares (${n}/${rows.length})`,n===rows.length);

  // an intraday row must not pass its padded state off as the close rule
  const intr=copy(nvda);intr.state="BROKEN";intr._basis="intraday";intr.name="ZZZZ";
  let t=line(intr);
  check("intraday, no close copy for the name: plain shares, no multiplier",
    t.includes("risk: 11 sh")&&!t.includes("×"));
  intr.name="NVDA";
  w.adoptStates({as_of:"2099-01-01T17:00:00-05:00",basis:"close",names:[{name:"NVDA",state:"EARLY"}]},"test");
  t=line(intr);
  check("intraday: the close copy's state is used, not the padded one",
    t.includes("11 sh × 0.50 (EARLY) = 5 sh")&&!t.includes("BROKEN"));
  w.adoptStates({as_of:"2098-01-01T17:00:00-05:00",basis:"close",names:[{name:"NVDA",state:"NONE"}]},"test");
  check("an older close document does not replace it",line(intr).includes("(EARLY)"));
  w.adoptStates({as_of:"2099-06-01T10:00:00-05:00",basis:"intraday",names:[{name:"NVDA",state:"NONE"}]},"test");
  check("an intraday document does not replace it",line(intr).includes("(EARLY)"));

  // an unknown state and a row with no size block
  const un=copy(nvda);un.state="UNCLASSIFIED";t=line(un);
  check("an unknown state shows plain shares",t.includes("risk: 11 sh")&&!t.includes("×"));
  const ns=copy(nvda);delete ns.size;
  check("no size block, no line",line(ns)==="");
  check("a device account override still sizes first",(()=>{
    try{w.localStorage.setItem("walls_account","20000");}catch(e){return false;}
    const r=copy(nvda);r.state="STRESSED";const x=line(r);
    w.localStorage.removeItem("walls_account");return x.includes("23 sh × 0.25 (STRESSED) = 5 sh");})());

  // ACTION. Every close document here is dated past the page's own, so it
  // becomes the newest close copy; each step moves the date on.
  let yr=2200;
  const closeDoc=(state,lt,session,extra)=>{yr++;return Object.assign({as_of:yr+"-01-01T17:00:00-05:00",
    basis:"close",session,names:[{name:"NVDA",state,last_transition:lt}]},extra||{});};
  const act=(r)=>{host.innerHTML=w.memberCard(r,null,false);const e=host.querySelector(".actionline");
    return e?e.textContent.replace(/\s+/g," ").trim():"";};
  const H="HEALTHY",E="EARLY",T="STRESSED",N="NONE",B="BROKEN";
  const PAIRS=[[H,E,"sell 50%","hold 4 of 9 sh"],[H,T,"sell 75%","hold 2 of 9 sh"],
   [H,N,"sell 75%","hold 2 of 9 sh"],[H,B,"sell all","hold 0 sh"],
   [E,H,"buy to full","hold 9 sh"],[E,T,"sell 50%","hold 2 of 9 sh"],
   [E,N,"sell 50%","hold 2 of 9 sh"],[E,B,"sell all","hold 0 sh"],
   [T,H,"buy to full","hold 9 sh"],[T,E,"buy 25%","hold 4 of 9 sh"],
   [T,N,"no change","hold 2 of 9 sh"],[T,B,"sell all","hold 0 sh"],
   [N,H,"buy to full","hold 9 sh"],[N,E,"buy 25%","hold 4 of 9 sh"],
   [N,T,"no change","hold 2 of 9 sh"],[N,B,"sell all","hold 0 sh"],
   [B,H,"buy to full","hold 9 sh"],[B,E,"buy 50%","hold 4 of 9 sh"],
   [B,T,"buy 25%","hold 2 of 9 sh"],[B,N,"buy 25%","hold 2 of 9 sh"]];
  check("the table covers all 20 from/to pairs",new Set(PAIRS.map(p=>p[0]+p[1])).size===20);
  for(const [a,b,v,h] of PAIRS){
    w.adoptStates(closeDoc(b,{date:"2200-11-06",from:a,to:b},"2200-11-06"),"test");
    const want=`ACTION ${a} → ${b} on the 11-06 close · ${v} · ${h}`;
    check(want,act(shaped(9,b))===want);
  }
  // a stale transition
  w.adoptStates(closeDoc(T,{date:"2200-11-05",from:H,to:T},"2200-11-06"),"test");
  check("no ACTION when the transition predates the most recent close",act(shaped(9,T))==="");
  check("but the size line still shows",line(shaped(9,T)).includes("9 sh × 0.25 (STRESSED) = 2 sh"));
  // an intraday-only state: the row is padded, the close copy shows no change
  const quiet=shaped(9,B);quiet._basis="intraday";
  quiet.last_transition={date:"2200-11-07",from:H,to:B};
  check("no ACTION on an intraday-only state",act(quiet)==="");
  // the row's own last_transition is never read, on either basis
  const own=shaped(9,T);own.last_transition={date:"2200-11-06",from:H,to:T};
  check("a row's own last_transition is not read",act(own)==="");
  // a stale close copy behind an intraday document
  w.adoptStates(closeDoc(T,{date:"2200-11-06",from:H,to:T},"2200-11-06"),"test");
  check("a transition on the most recent close shows",act(shaped(9,T))!=="");
  const intra=shaped(9,B);intra._basis="intraday";
  check("and shows on an intraday row, from the close copy",act(intra).startsWith("ACTION HEALTHY → STRESSED"));
  w.adoptStates({as_of:"2300-01-01T10:00:00-05:00",basis:"intraday",session:"2200-11-10",
    reference_session:"2200-11-09",names:[]},"test");
  check("not when an intraday document names a newer close than the copy",act(intra)==="");
  // the account, and a row with nothing to size
  yr=2400;
  w.adoptStates(closeDoc(T,{date:"2400-11-06",from:H,to:T},"2400-11-06"),"test");
  check("the device account sizes ACTION too",(()=>{
    w.localStorage.setItem("walls_account","20000");
    const r=copy(nvda);r.state=T;const x=act(r);
    w.localStorage.removeItem("walls_account");return x.includes("hold 5 of 23 sh");})());
  const none=copy(nvda);delete none.size;
  check("no size block, no ACTION",act(none)==="");
  const off=copy(nvda);off.name="ZZZZ";
  check("a name with no close copy, no ACTION",act(off)==="");
  // the frozen file itself
  const frozen=Object.assign(copy(doc),{as_of:"2500-01-01T17:00:00-05:00"});
  w.adoptStates(frozen,"test");
  const moved=rows.filter(r=>r.last_transition&&r.last_transition.date===doc.session);
  const still=rows.filter(r=>!(r.last_transition&&r.last_transition.date===doc.session));
  check(`every frozen row that moved on the close shows ACTION (${moved.filter(r=>act(r)).length}/${moved.length})`,
    moved.length>0&&moved.every(r=>act(r).startsWith(`ACTION ${r.last_transition.from} → ${r.last_transition.to} on the 10-09 close`)));
  check(`no frozen row with an older transition shows it (${still.filter(r=>!act(r)).length}/${still.length})`,
    still.length>0&&still.every(r=>act(r)===""));
  done();};
}).catch(e=>{check("load: "+e.message,false);done();});
</script>
